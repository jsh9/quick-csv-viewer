name: Publish

# Publishes the extension to the Visual Studio Marketplace and Open VSX when a
# version tag such as `0.0.4` is pushed. Both registries use trusted publishing
# (GitHub OIDC), so no publishing token is stored in this repository. The
# registries only accept tokens from this workflow file in jsh9/quick-csv-viewer;
# see "Releasing" in README.md for the one-time registry setup.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # @vscode/vsce 4 and ovsx 1.3 require Node.js 22 or newer.
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package the extension
        run: npx --yes @vscode/vsce@4.1.0 package --out quick-csv-viewer.vsix

      - name: Keep the package with this run
        uses: actions/upload-artifact@v6
        with:
          name: quick-csv-viewer-${{ github.ref_name }}
          path: quick-csv-viewer.vsix

      # --skip-duplicate makes a re-run safe after one registry has already
      # accepted this version.
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath quick-csv-viewer.vsix

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish quick-csv-viewer.vsix --trusted-publishing --skip-duplicate
