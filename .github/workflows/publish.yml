name: Publish

# Publishes the extension to the Visual Studio Marketplace and Open VSX when a
# version tag such as `0.0.4` is pushed, then creates the GitHub release for the
# tag with the CHANGELOG.md section as notes and the .vsix attached. Both
# registries use trusted publishing (GitHub OIDC), so no publishing token is
# stored in this repository. The registries only accept tokens from this
# workflow file in jsh9/quick-csv-viewer; see "Releasing" in README.md for the
# one-time registry setup.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: create the GitHub release and attach the .vsix to it.
      contents: write
      id-token: write
    env:
      HUSKY: 0
      VSIX: quick-csv-viewer-${{ github.ref_name }}.vsix

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # @vscode/vsce 4 and ovsx 1.3 require Node.js 22 or newer.
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      # Fails before anything is published when CHANGELOG.md has no section for
      # this version.
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/release-notes.cjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package the extension
        run: npx --yes @vscode/vsce@4.1.0 package --out "$VSIX"

      - name: Keep the package with this run
        uses: actions/upload-artifact@v6
        with:
          name: quick-csv-viewer-${{ github.ref_name }}
          path: ${{ env.VSIX }}

      # --skip-duplicate makes a re-run safe after one registry has already
      # accepted this version.
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath "$VSIX"

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.3.0 publish "$VSIX" --trusted-publishing --skip-duplicate

      # Runs only after both registries accepted the version. A release that
      # already exists for the tag (for example one drafted by hand) keeps its
      # notes and only gets the .vsix attached, so a re-run is safe too.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag
          fi
